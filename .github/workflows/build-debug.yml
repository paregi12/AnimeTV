name: Build Debug APK

on:
  push:
    branches: [ kmp ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'push debug') || contains(github.event.head_commit.message, 'Push debug') || contains(github.event.head_commit.message, 'Push Debug') || contains(github.event.head_commit.message, 'PUSH DEBUG') || contains(github.event.head_commit.message, 'push-debug') || contains(github.event.head_commit.message, 'Push-Debug') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/debug.keystore ]; then
            keytool -genkey -v -keystore keystore/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          rm -rf "$HOME/.gradle/.tmp"
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animetv-debug.apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
