plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amarullz.androidtv.animetvjmto'
    compileSdk 34

    defaultConfig {
        applicationId "com.amarullz.androidtv.animetvjmto"
        minSdk 22
        targetSdk 34

        def appVersionCode = 666
        if (System.getenv("APP_VERSION_CODE") != null) {
            try {
                appVersionCode = Integer.parseInt(System.getenv("APP_VERSION_CODE"))
            } catch (Exception ignored) {}
        }
        versionCode appVersionCode

        def appVersionName = "6.6.7-Nightly"
        if (System.getenv("APP_VERSION_NAME") != null) {
            appVersionName = System.getenv("APP_VERSION_NAME")
        }
        versionName appVersionName

        // Automatic Build Version
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        setProperty("archivesBaseName", "animetv-" + versionName)
    }

    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            File ksFile = null
            if (ksPath != null) {
                ksFile = file(ksPath)
                if (!ksFile.exists()) {
                    ksFile = rootProject.file(ksPath)
                }
            }
            if (ksFile == null || !ksFile.exists()) {
                ksFile = file('../keystore/release.keystore')
            }
            if (!ksFile.exists()) {
                ksFile = file('../keystore/debug.keystore')
            }

            storeFile ksFile
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: (ksFile.name.contains("release") ? "animetv" : "androiddebugkey")
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG"
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {

    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.tvprovider:tvprovider:1.0.0'

    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.devbrackets.android:exomedia:5.0.0'

    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation('com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0')
    implementation("androidx.webkit:webkit:1.12.1")
    implementation 'com.google.android.gms:play-services-cronet:18.1.0'

    // Cast:
//    implementation 'androidx.mediarouter:mediarouter:1.2.5'
//    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20"
//    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.0"
}
